<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Heatsink Loading</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --card2:#1e222b; --line:#2a2f3a;
    --tx:#e8eaed; --mut:#9aa3af; --accent:#3b82f6; --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--tx);
    font-family:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif; font-size:16px;}
  body{padding:0 0 calc(16px + env(safe-area-inset-bottom));}
  header{display:flex; align-items:center; gap:10px; padding:calc(12px + env(safe-area-inset-top)) 14px 12px;
    background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5;}
  .brand{font-size:17px; font-weight:800; flex:1;}
  .date{font-size:12px; color:var(--mut);}
  .done{background:var(--card2); border:1px solid var(--line); border-radius:20px;
    padding:6px 12px; font-size:13px; font-weight:700;}
  .done span{color:var(--ok);}
  .wrap{padding:14px;}

  .cta{width:100%; background:var(--accent); color:#fff; border:0; border-radius:16px;
    padding:22px; font-size:20px; font-weight:800; line-height:1.3; margin-bottom:12px;}
  .cta:active{filter:brightness(.88);}
  .cta small{display:block; font-size:13px; font-weight:600; opacity:.9; margin-top:4px;}

  .toolbar{display:flex; gap:10px; margin-bottom:16px;}
  .tbtn{flex:1; background:var(--card2); color:var(--tx); border:1px solid var(--line);
    border-radius:12px; padding:14px; font-size:14px; font-weight:700;}
  .tbtn:active{filter:brightness(1.3);}
  .tbtn.warn{color:var(--warn);}

  .sechd{font-size:12px; font-weight:700; letter-spacing:.4px; color:var(--mut);
    text-transform:uppercase; margin:6px 2px 10px;}
  .empty{color:var(--mut); font-size:14px; text-align:center; padding:30px 10px;}

  .box{display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line);
    border-radius:12px; padding:14px; margin-bottom:9px;}
  .box .chk{width:30px; height:30px; border-radius:50%; background:var(--ok); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:800; flex:0 0 auto;}
  .box .bid{flex:1; min-width:0;}
  .box .bid .s{font-size:18px; font-weight:800; letter-spacing:.5px;}
  .box .bid .f{font-size:11px; color:var(--mut); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .box .bt{font-size:11px; color:var(--mut);}

  /* camera (E) overlay */
  #previewOverlay{position:fixed; inset:0; z-index:9999; display:none;}
  #previewOverlay.show{display:block;}
  html.previewing, body.previewing{background:transparent !important;}
  body.previewing #app{display:none;}
  #pvTop{position:absolute; top:calc(14px + env(safe-area-inset-top)); left:0; right:0; text-align:center; z-index:2;}
  #pvTop .t1{display:inline-block; background:rgba(0,0,0,.55); color:#fff; border-radius:10px;
    padding:9px 16px; font-size:16px; font-weight:800;}
  #pvControls{position:absolute; left:0; right:0; bottom:calc(28px + env(safe-area-inset-bottom));
    display:flex; align-items:center; justify-content:center; gap:26px;}
  #pvShoot{width:80px; height:80px; border-radius:50%; background:#fff; border:6px solid rgba(255,255,255,.5);}
  #pvShoot:active{transform:scale(.92);}
  #pvShoot:disabled{opacity:.4;}
  #pvDone{background:var(--ok); color:#fff; border:0; border-radius:26px; padding:16px 22px; font-size:15px; font-weight:800; display:none;}
  #pvCancel{position:absolute; top:calc(14px + env(safe-area-inset-top)); right:14px;
    background:rgba(0,0,0,.5); color:#fff; border:0; border-radius:20px; padding:9px 15px; font-size:14px; font-weight:700;}
  #pvThumbs{position:absolute; left:0; right:0; bottom:calc(130px + env(safe-area-inset-bottom));
    display:flex; gap:8px; justify-content:center;}
  #pvThumbs img{width:52px; height:52px; object-fit:cover; border-radius:7px; border:2px solid #fff;}

  /* view modal */
  #viewModal{position:fixed; inset:0; z-index:9000; background:var(--bg); display:none; overflow:auto;}
  #viewModal.show{display:block;}
  #viewModal .mh{display:flex; align-items:center; gap:10px; padding:calc(12px + env(safe-area-inset-top)) 14px 12px;
    background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0;}
  #viewModal .mh .s{font-size:20px; font-weight:800; flex:1;}
  #viewModal .mh button{background:var(--card2); color:var(--tx); border:1px solid var(--line);
    border-radius:10px; padding:9px 14px; font-size:14px; font-weight:700;}
  #viewFull{font-size:12px; color:var(--mut); padding:8px 16px 0; word-break:break-all;}
  #viewPhotos{padding:12px 14px;}
  #viewPhotos img{width:100%; border-radius:12px; border:1px solid var(--line); margin-bottom:12px;}
  #viewActions{display:flex; gap:10px; padding:0 14px 24px;}
  #viewActions button{flex:1; border-radius:12px; padding:15px; font-size:14px; font-weight:800; border:0;}
  #reshootBtn{background:var(--warn); color:#111;}
  #deleteBtn{background:var(--bad); color:#fff;}

  #toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(30px + env(safe-area-inset-bottom));
    background:#000; color:#fff; padding:12px 20px; border-radius:24px; font-size:14px; font-weight:700;
    z-index:12000; opacity:0; transition:opacity .2s; pointer-events:none; max-width:88%; text-align:center;}
  #toast.show{opacity:.95;}

  #busy{position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:13000; display:none;
    align-items:center; justify-content:center; flex-direction:column; gap:14px;}
  #busy.show{display:flex;}
  #busy .sp{width:44px; height:44px; border:4px solid #444; border-top-color:#fff; border-radius:50%; animation:spin 1s linear infinite;}
  #busy .txt{color:#fff; font-size:14px; font-weight:700;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">Heatsink Loading</div>
    <div>
      <div class="date" id="dateLbl"></div>
    </div>
    <div class="done">Done <span id="doneCount">0</span></div>
  </header>
  <div class="wrap">
    <button id="newBox" class="cta">+ New box &middot; Nueva caja
      <small>Scan barcode &middot; Escanear c&oacute;digo</small></button>
    <div class="toolbar">
      <button class="tbtn" id="pdfBtn">Export PDF &middot; PDF</button>
      <button class="tbtn warn" id="resetBtn">Clear day &middot; Borrar</button>
    </div>
    <div class="sechd">Completed today &middot; Completadas hoy</div>
    <div id="list"><div class="empty">No boxes yet &middot; A&uacute;n no hay cajas</div></div>
  </div>
</div>

<!-- E camera overlay (3 photos) -->
<div id="previewOverlay">
  <div id="pvTop"><span class="t1" id="pvTitle">Photo 1 / 3</span></div>
  <button id="pvCancel">Cancel &middot; Cancelar</button>
  <div id="pvThumbs"></div>
  <div id="pvControls">
    <button id="pvShoot" aria-label="capture"></button>
    <button id="pvDone">Save &middot; Guardar</button>
  </div>
</div>

<!-- box view modal -->
<div id="viewModal">
  <div class="mh">
    <div class="s" id="viewShort"></div>
    <button id="viewClose">Close &middot; Cerrar</button>
  </div>
  <div id="viewFull"></div>
  <div id="viewPhotos"></div>
  <div id="viewActions">
    <button id="reshootBtn">Re-shoot &middot; Rehacer</button>
    <button id="deleteBtn">Delete &middot; Eliminar</button>
  </div>
</div>

<div id="toast"></div>
<div id="busy"><div class="sp"></div><div class="txt" id="busyTxt">Working...</div></div>

<script src="jspdf.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
